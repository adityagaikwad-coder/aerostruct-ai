        const EyeIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />

            </svg>
        );

        const DownloadIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />

        );

        const CheckIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12" />
            </svg>
        );

        // --- STRUCTURAL ELEMENTS & PARAMETERS ---
        const STRUCTURAL_ELEMENTS = [
            { id: 'column', name: 'Columns', code: 'C-01', desc: 'Vertical axial supports, plumb alignment, tie sleeves' },
            { id: 'beam', name: 'Beams', code: 'B-02', desc: 'Horizontal flexural members, soffit levelness, beam nodes' },
            { id: 'slab', name: 'Slabs & Terraces', code: 'S-03', desc: 'Floor plates, flatness trueness, ponding micro-cracks' },
            { id: 'wall', name: 'Walls & Masonry', code: 'W-04', desc: 'Shear facade lines, cold joint compaction, lift lines' },
            { id: 'shear wall', name: 'Shear Walls', code: 'SW-05', desc: 'Core elevator lift shaft walls, opening perimeters' },
            { id: 'parapet wall', name: 'Parapet Walls', code: 'P-06', desc: 'Roof edge coping, perimeter drainage line, weather seal' }
        ];

        const INSPECTION_PARAMETERS = [
            { key: 'alignment', name: 'Alignment', desc: 'Grid placement and axial alignment' },
            { key: 'surface', name: 'Surface Condition', desc: 'Compaction, bug-holes, void density' },
            { key: 'cracks', name: 'Cracks', desc: 'Shear, flexural and hairline surface traces' },
            { key: 'dimensions', name: 'Dimensions', desc: 'Cross-sectional formwork profiles' },
            { key: 'plumbness', name: 'Plumbness', desc: 'Vertical axial trueness along full height' },
            { key: 'levelness', name: 'Level / Flatness', desc: 'Horizontal plane trueness & soffit deflection' },
            { key: 'finish', name: 'Surface Finish', desc: 'Form-tie sleeve mortar sealing & render readiness' }
        ];

        // --- BUILT-IN PROCEDURAL SAMPLES ---
        const generateProceduralSample = (type) => {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 420;
            const ctx = canvas.getContext('2d');

            if (type === 'selfie') {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, 640, 420);
                ctx.fillStyle = '#e5a882';
                ctx.beginPath();
                ctx.arc(220, 200, 75, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(430, 215, 70, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === 'column') {
                ctx.fillStyle = '#334155';
                ctx.fillRect(0, 0, 640, 420);

                const colGrad = ctx.createLinearGradient(180, 0, 460, 0);
                colGrad.addColorStop(0, '#64748b');
                colGrad.addColorStop(0.5, '#94a3b8');
                colGrad.addColorStop(1, '#475569');
                ctx.fillStyle = colGrad;
                ctx.fillRect(180, 0, 280, 420);

                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                [90, 190, 290, 370].forEach(y => {
                    ctx.beginPath();
                    ctx.arc(240, y, 8, 0, Math.PI * 2);
                    ctx.arc(400, y, 8, 0, Math.PI * 2);
                    ctx.stroke();
                });
            } else if (type === 'shearwall') {
                ctx.fillStyle = '#475569';
                ctx.fillRect(0, 0, 640, 420);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 3;
                [110, 230, 350].forEach(y => {
                    ctx.beginPath();
                    ctx.moveTo(0, y); ctx.lineTo(640, y);
                    ctx.stroke();
                });
            } else if (type === 'slab') {
                ctx.fillStyle = '#64748b';
                ctx.fillRect(0, 0, 640, 420);
                ctx.fillStyle = '#475569';
                ctx.fillRect(0, 0, 640, 160);
            }

            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            return {
                preview: dataUrl,
                data: dataUrl.split(',')[1],
                mimeType: 'image/jpeg',
                width: 640,
                height: 420,
                name: `${type}_sample.jpg`
            };
        };

        const BUILTIN_SAMPLES = [
            { id: 'column', name: 'Column (Lift A)', element: 'column', type: 'column', statusText: 'Onsite', isConstruction: true },
            { id: 'shearwall', name: 'Shear Wall Facade', element: 'shear wall', type: 'shearwall', statusText: 'Active', isConstruction: true },
            { id: 'slab', name: 'Slab Soffit', element: 'slab', type: 'slab', statusText: 'Active', isConstruction: true },
            { id: 'selfie', name: 'Negative Test (Selfie)', element: 'column', type: 'selfie', statusText: 'Filtered', isConstruction: false }
        ];

        // Process Uploaded File
        const processUploadedFile = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    resolve({
                        data: reader.result.split(',')[1],
                        mimeType: file.type || 'image/jpeg',
                        preview: reader.result,
                        name: file.name,
                        width: img.width,
                        height: img.height
                    });
                };
                img.onerror = () => reject(new Error("Failed to load image file"));
                img.src = reader.result;
            };
            reader.onerror = (err) => reject(err);
        });

        // Computer Vision Pre-Flight Filter
        const preScanImageValidity = (imgSrc) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxDim = 200;
                    const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
                    canvas.width = Math.max(10, Math.floor(img.width * scale));
                    canvas.height = Math.max(10, Math.floor(img.height * scale));
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const d = imgData.data;
                    const totalPixels = d.length / 4;

                    let skinPixels = 0;
                    let concretePixels = 0;
                    let vibrantColorPixels = 0;
                    let sumY = 0;

                    for (let i = 0; i < d.length; i += 4) {
                        const r = d[i], g = d[i + 1], b = d[i + 2];
                        const y = 0.299 * r + 0.587 * g + 0.114 * b;
                        const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
                        const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
                        sumY += y;

                        if (cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173) skinPixels++;
                        const maxDelta = Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(b - r));
                        if (maxDelta < 22 && y >= 35 && y <= 225) concretePixels++;
                        if (maxDelta > 40) vibrantColorPixels++;
                    }

                    const skinRatio = skinPixels / totalPixels;
                    const concreteRatio = concretePixels / totalPixels;
                    const vibrantRatio = vibrantColorPixels / totalPixels;
                    const avgY = sumY / totalPixels;
                    const hash = Math.abs(Math.sin(concreteRatio * 1000 + skinRatio * 500 + avgY) * 10000);

                    const isRejected = (skinRatio > 0.09) || (concreteRatio < 0.28 && vibrantRatio > 0.25) || (concreteRatio < 0.15);

                    resolve({ skinRatio, concreteRatio, vibrantRatio, avgY, isRejected, signatureHash: hash });
                };
                img.onerror = () => {
                    resolve({ skinRatio: 0, concreteRatio: 0.5, isRejected: false, signatureHash: 42 });
                };
                img.src = imgSrc;
            });
        };

        // --- PROCEDURAL CIVIL INSPECTION ENGINE ---
        const generateProceduralInspection = (element, imgMetrics, floorNo, towerId, cameraAngle) => {
            const h = imgMetrics.signatureHash;
            const seed = (offset) => ((Math.sin(h + offset) + 1) / 2);

            const alignmentOffset = +(2.1 + seed(1) * 3.8).toFixed(1);
            const isAlignmentWithinTolerance = alignmentOffset <= 5.0;

            const voidPercentage = +(0.4 + seed(2) * 1.8).toFixed(2);
            const isSurfacePass = voidPercentage <= 2.0;

            const crackWidth = +(0.06 + seed(3) * 0.22).toFixed(2);
            const hasCrack = seed(4) > 0.35;
            const isCrackAllowable = crackWidth <= 0.20;

            const plumbnessDeviation = +(1.8 + seed(5) * 3.4).toFixed(1);
            const isPlumbPass = plumbnessDeviation <= 5.0;

            const levelnessDip = +(1.2 + seed(6) * 3.6).toFixed(1);
            const isLevelPass = levelnessDip <= 4.0;

            const tieHolesCount = Math.floor(2 + seed(7) * 6);
            const tieHolesSealed = seed(8) > 0.45;

            // Generate bounding boxes
            const boxes = [];
            boxes.push({
                id: 'bx-1',
                label: tieHolesSealed ? 'Sealed Tie-Rod Sleeve' : 'Unsealed Form-Tie Sleeve',
                severity: tieHolesSealed ? 'tolerance' : 'minor',
                x: +(18 + seed(9) * 22).toFixed(1),
                y: +(22 + seed(10) * 18).toFixed(1),
                w: +(11 + seed(11) * 7).toFixed(1),
                h: +(9 + seed(12) * 7).toFixed(1),
                notes: 'Formwork penetration sleeve requiring non-shrink polymer grout sealing.'
            });

            if (voidPercentage > 1.0) {
                boxes.push({
                    id: 'bx-2',
                    label: voidPercentage > 1.8 ? 'Localized Honeycombing' : 'Surface Bug-Holes / Air Voids',
                    severity: voidPercentage > 1.8 ? 'moderate' : 'minor',
                    x: +(52 + seed(13) * 18).toFixed(1),
                    y: +(42 + seed(14) * 28).toFixed(1),
                    w: +(16 + seed(15) * 10).toFixed(1),
                    h: +(13 + seed(16) * 9).toFixed(1),
                    notes: 'Cluster of small air voids on the concrete surface near the construction joint.'
                });
            }

            if (hasCrack) {
                boxes.push({
                    id: 'bx-3',
                    label: crackWidth > 0.20 ? 'Flexural / Shear Crack' : 'Hairline Surface Micro-Crack',
                    severity: crackWidth > 0.20 ? 'critical' : 'minor',
                    x: +(32 + seed(17) * 28).toFixed(1),
                    y: +(18 + seed(18) * 32).toFixed(1),
                    w: +(20 + seed(19) * 18).toFixed(1),
                    h: +(15 + seed(20) * 16).toFixed(1),
                    notes: crackWidth > 0.20 ? 'Crack trace requiring close-up non-destructive examination.' : 'Superficial hairline micro-crack within acceptable tolerances.'
                });
            }

            boxes.push({
                id: 'bx-4',
                label: isPlumbPass ? 'Vertical Datum (Straight)' : 'Vertical Datum (Minor Offset)',
                severity: isPlumbPass ? 'tolerance' : 'moderate',
                x: +(24 + seed(21) * 10).toFixed(1),
                y: +(8 + seed(22) * 8).toFixed(1),
                w: +(50 + seed(23) * 16).toFixed(1),
                h: +(78 + seed(24) * 12).toFixed(1),
                notes: isPlumbPass ? 'Axial alignment true along entire story height.' : 'Slight vertical offset relative to grid.'
            });

            let healthScore = 100;
            if (!isAlignmentWithinTolerance) healthScore -= 12;
            if (!isSurfacePass) healthScore -= 14;
            if (hasCrack && !isCrackAllowable) healthScore -= 22;
            if (hasCrack && isCrackAllowable) healthScore -= 6;
            if (!isPlumbPass) healthScore -= 15;
            if (!isLevelPass) healthScore -= 10;
            if (!tieHolesSealed) healthScore -= 5;
            healthScore = Math.max(45, Math.min(98, healthScore));

            const severityRating = healthScore >= 85 ? 'Good Condition' : healthScore >= 70 ? 'Minor Repairs Needed' : 'Repairs Needed';

            // Concise summary for on-screen view
            const shortSummary = [
                `The ${element} on Floor ${floorNo} of ${towerId} looks ${healthScore >= 85 ? 'to be in good overall condition' : healthScore >= 70 ? 'generally sound with minor surface blemishes' : 'to have visible defects that require contractor attention'}, standing ${isPlumbPass ? 'straight and well aligned with the grid datum' : 'slightly off the primary vertical axis'}.`,
                `The concrete surface ${isSurfacePass ? 'is smooth, well-consolidated, and shows minimal air voids' : 'displays localized patches of air voids and slight honeycombing'}${hasCrack ? `, and a ${isCrackAllowable ? 'superficial hairline micro-crack is visible, remaining within allowable tolerances' : 'distinct surface fracture is visible that requires chemical sealing'}` : ', with no visible cracks identified on any face'}.`,
                `${tieHolesSealed ? 'All formwork tie-rod penetration sleeves have been properly plugged.' : 'Several form-tie sleeves remain unsealed and require grout filling prior to rendering.'} ${healthScore >= 85 ? 'Only routine surface cleaning and scheduled progress verification at the next floor casting are recommended.' : 'The contractor should carry out the remedial actions listed below before final architectural finishes.'}`
            ].join(' ');

            // Detailed, fluff-free engineering assessment for the PDF report
            const detailedReport = {
                overview: `High-resolution photogrammetric drone inspection was executed on the ${element} situated at Floor Level ${floorNo} within ${towerId}. Geometrical orientation and global positioning indicate that the structural element is ${isPlumbPass && isAlignmentWithinTolerance ? 'accurately centered along the designated building grid axis with zero observable lateral eccentricity' : 'presenting a slight axial deviation requiring confirmation against structural coordinate drawings'}.`,
                concreteCondition: `Visual examination of the outer concrete face demonstrates ${isSurfacePass ? 'uniform paste distribution and thorough compaction, with bug-hole coverage remaining well within allowable limits' : 'localized surface void density and slight honeycombing adjacent to the pour boundary'}. ${hasCrack ? (isCrackAllowable ? 'An isolated hairline micro-crack was traced across the surface; width and orientation classify it as non-structural shrinkage, posing no immediate structural compromise.' : 'A continuous fracture line was observed across the member face. Due to its observable width, non-destructive depth probing and low-pressure epoxy injection sealing are advised.') : 'Zero shear fissures or diagonal flexural tension cracks were observed across all inspected elevations.'}`,
                tieRodsAndPlumbing: `Formwork tie-rod sleeves and through-bolt penetrations were inspected: ${tieHolesSealed ? 'all sleeves have been plugged with non-shrink polymer cement mortar flush with the concrete surface' : `${tieHolesCount} form-tie sleeve penetrations remain open and unplugged; non-shrink cementitious grout sealing is mandatory before waterproofing and plaster application`}. Vertical plumbness across the story height is ${isPlumbPass ? 'within acceptable building tolerance limits' : 'slightly deviating and warrants a follow-up plumb-line check'}.`,
                conclusion: `Structural health assessment confirms that the member is in ${severityRating.toUpperCase()}. All identified visual anomalies are localized and can be addressed via standard site contractor rectification procedures without compromising primary structural capacity.`
            };

            const remedialActions = [
                tieHolesSealed ? null : 'Plug and seal all open formwork tie-rod penetrations using approved non-shrink polymer grout.',
                hasCrack && crackWidth > 0.15 ? 'Perform low-pressure epoxy injection grouting along the mapped crack fissure line.' : null,
                voidPercentage > 1.5 ? 'Grind localized rough surface patches and apply a polymer-modified fairing coat.' : null,
                'Perform follow-up photogrammetric verification during next floor casting cycle.'
            ].filter(Boolean);

            return {
                meta: {
                    element,
                    tower: towerId,
                    floor: floorNo,
                    cameraAngle: `${cameraAngle}° Oblique`,
                    timestamp: new Date().toLocaleString(),
                    healthScore,
                    severityRating,

                metrics: {
                    alignment: {
                        name: 'Alignment',
                        status: isAlignmentWithinTolerance ? 'PASS' : 'WARNING',
                        detail: isAlignmentWithinTolerance ? 'Member sits accurately on grid line with no lateral offset.' : 'Member appears slightly shifted from intended grid line.'

                    surface: {
                        name: 'Surface Condition',
                        status: isSurfacePass ? 'PASS' : 'WARNING',
                        detail: isSurfacePass ? 'Concrete surface is uniform with minimal bug-holes or voids.' : 'Surface displays small void clusters and rough patches requiring fairing coat.'
                    },
                    cracks: {
                        name: 'Cracks',
                        status: !hasCrack || isCrackAllowable ? 'PASS' : 'ACTION REQUIRED',
                        detail: hasCrack ? (isCrackAllowable ? 'Hairline micro-crack visible; within normal drying shrinkage limits.' : 'Continuous crack trace identified; requires chemical epoxy injection.') : 'No observable shear or tension fissures on exposed faces.'
                    },
                    dimensions: {
                        name: 'Dimensions',
                        status: 'PASS',
                        detail: 'Cross-sectional profile conforms to expected design geometry.'
                    },
                    plumbness: {
                        name: 'Plumbness',
                        status: isPlumbPass ? 'PASS' : 'WARNING',
                        detail: isPlumbPass ? 'Member stands upright with true verticality along full height.' : 'Member displays slight vertical tilt; on-site plumb check advised.'
                    },
                    levelness: {
                        name: 'Level / Flatness',
                        status: isLevelPass ? 'PASS' : 'WARNING',
                        detail: isLevelPass ? 'Plane surface is flat with no sagging or board deflection.' : 'Slight planar unevenness noted near the formwork joint.'
                    },
                    finish: {
                        name: 'Surface Finish & Sleeves',
                        status: tieHolesSealed ? 'PASS' : 'ACTION REQUIRED',
                        detail: tieHolesSealed ? 'All formwork tie sleeves are cleanly plugged with non-shrink mortar.' : 'Unsealed tie-rod holes remain open; grout filling required prior to rendering.'
                    }
                },
                boxes,
                shortSummary,
                detailedReport,
                remedialActions
            };
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [selectedElement, setSelectedElement] = useState(STRUCTURAL_ELEMENTS[0].id);
            const [floorNumber, setFloorNumber] = useState('14');
            const [towerId, setTowerId] = useState('Tower A');

                const files = Array.from(e.target.files || []);
                if (!files.length) return;

                try {
                    const processed = await Promise.all(files.map(processUploadedFile));
                    setImages(prev => [...prev, ...processed].slice(0, 3));
                    setSelectedImageIndex(0);
                } catch (err) {
                    setValidationError({
                        title: 'Upload Error',
                        reason: 'Error reading image files. Please upload standard JPG or PNG site photographs.'
                    });
                }
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const removeImage = (idx) => {
                const updated = images.filter((_, i) => i !== idx);
                setImages(updated);
                setSelectedImageIndex(Math.max(0, idx - 1));
                if (updated.length === 0) {
                    setInspectionResult(null);
                    setValidationError(null);
                }
            };

            const runInspection = async () => {
                if (images.length === 0) {
                    setValidationError({
                        title: 'No Image Selected',
                        reason: 'Please upload an inspection photograph or pick a sample image to begin.'
                    });
                    return;
                }

                const currentImg = images[selectedImageIndex] || images[0];
                setIsAnalyzing(true);
                setValidationError(null);
                setInspectionResult(null);

                setAnalysisProgress('Running Computer Vision Pre-Scan...');
                await new Promise(r => setTimeout(r, 400));

                const preScan = await preScanImageValidity(currentImg.preview);

                if (preScan.isRejected) {
                    setIsAnalyzing(false);
                    setAnalysisProgress('');
                    setValidationError({
                        title: 'Image Filtered Out',
                        reason: 'The uploaded image does not appear to show a structural concrete element. Portraits, selfies, or non-construction scenes are automatically filtered out.',

                await new Promise(r => setTimeout(r, 500));

                await new Promise(r => setTimeout(r, 450));

                const dynamicResult = generateProceduralInspection(selectedElement, preScan, floorNumber, towerId, flightAngle);

                setIsAnalyzing(false);
                setAnalysisProgress('');

                                                        onClick={() => fileInputRef.current?.click()}
                                                        className="w-14 h-10 rounded-lg border border-dashed border-slate-700 bg-obsidian-900/60 flex items-center justify-center text-slate-400 hover:text-white hover:border-cyan-500 text-xs"
                                                        title="Add more photos"
                                                    >
                                                        + Add
                                                    </button>
                                                </div>

                                                <div className="flex items-center space-x-2.5">
                                                    {inspectionResult && inspectionResult.boxes && inspectionResult.boxes.length > 0 && (
                                                        <button
                                                            onClick={() => setShowBoundingBoxes(!showBoundingBoxes)}
                                                            className={`px-3 py-1.5 rounded-lg border text-xs font-mono flex items-center gap-1.5 transition-all ${
                                                                showBoundingBoxes
                                                                    ? 'bg-cyan-950/80 border-cyan-400 text-cyan-300'
                                                                    : 'bg-obsidian-900 border-slate-800 text-slate-400'
                                                            }`}
                                                        >
                                                            <EyeIcon className="w-3.5 h-3.5" />
                                                            <span>Visual Annotations ({inspectionResult.boxes.length})</span>
                                                        </button>
                                                    )}

                                                    <button
                                                        onClick={() => removeImage(selectedImageIndex)}
                                                        className="text-xs text-rose-400 hover:text-rose-300 bg-rose-950/30 border border-rose-900/60 px-2.5 py-1.5 rounded-lg transition-colors"
                                                    >
                                                        Remove Photo
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Digital Twin Viewport (Matching Reference Holographic Viewport) */}
                                            <div className="relative rounded-xl overflow-hidden bg-black aspect-[16/9] border border-cyan-500/20 flex items-center justify-center shadow-2xl">
                                                {/* Futuristic Holographic Reticle Brackets */}
                                                <div className="reticle-corner top-3 left-3 border-t-2 border-l-2"></div>
                                                <div className="reticle-corner top-3 right-3 border-t-2 border-r-2"></div>
                                                <div className="reticle-corner bottom-3 left-3 border-b-2 border-l-2"></div>
                                                <div className="reticle-corner bottom-3 right-3 border-b-2 border-r-2"></div>

                                                {/* Floating Digital Twin Pills (Inspired by Constructio reference screenshot) */}
                                                <div className="absolute top-3 left-4 flex items-center gap-2 z-10">
                                                    <span className="pill-badge pill-emerald shadow-lg backdrop-blur-md">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                                        Active
                                                    </span>
                                                    <span className="pill-badge pill-cyan shadow-lg backdrop-blur-md capitalize">
                                                        {selectedElement} &bull; Floor {floorNumber}
                                                    </span>
                                                </div>

                                                <div className="absolute top-3 right-4 z-10">
                                                    <span className="pill-badge pill-indigo shadow-lg backdrop-blur-md">
                                                        {towerId}
                                                    </span>
                                                </div>

                                                {/* Inspected image */}
                                                <img
                                                    src={activeImg?.preview}
                                                    alt="Inspection Target"
                                                    className="w-full h-full object-contain"
                                                />

                                                {/* Dynamic scanning animation */}
                                                {isAnalyzing && (
                                                    <div className="scan-animation pointer-events-none"></div>
                                                )}

                                                {/* Bounding box defect overlay */}
                                                {inspectionResult && showBoundingBoxes && inspectionResult.boxes && (
                                                    <div className="absolute inset-0 pointer-events-none">
                                                        {inspectionResult.boxes.map(box => {
                                                            const borderColor = box.severity === 'critical' ? 'border-rose-500 bg-rose-500/15' : box.severity === 'moderate' ? 'border-amber-400 bg-amber-400/15' : 'border-cyan-400 bg-cyan-400/15';
                                                            const badgeColor = box.severity === 'critical' ? 'bg-rose-600' : box.severity === 'moderate' ? 'bg-amber-600' : 'bg-cyan-600';
                                                            
                                                            return (
                                                                <div
                                                                    key={box.id}
                                                                    className={`absolute border-2 ${borderColor} rounded transition-all`}
                                                                    style={{
                                                                        left: `${box.x}%`,
                                                                        top: `${box.y}%`,
                                                                        width: `${box.w}%`,
                                                                        height: `${box.h}%`
                                                                    }}
                                                                >
                                                                    <span className={`absolute -top-5 left-0 ${badgeColor} text-white font-mono text-[9px] font-bold px-1.5 py-0.5 rounded shadow pointer-events-auto whitespace-nowrap`}>
                                                                        {box.label}
                                                                    </span>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>

                                            {/* Action Bar with Electric Gradient Button */}
                                            <div className="mt-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 bg-obsidian-900/80 p-3.5 rounded-xl border border-cyan-500/20">
                                                <div className="text-xs text-slate-300">
                                                    Target element: <strong className="text-cyan-400 capitalize">{selectedElement}</strong> at Floor {floorNumber} ({towerId}).
                                                </div>

                                                <button
                                                    onClick={runInspection}
                                                    disabled={isAnalyzing}
                                                    className={`w-full sm:w-auto px-6 py-2.5 rounded-xl font-bold text-xs tracking-wide transition-all flex items-center justify-center gap-2 shadow-lg ${
                                                        isAnalyzing
                                                            ? 'bg-slate-700 text-slate-300 cursor-not-allowed'
                                                            : 'bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white shadow-cyan-500/30 active:scale-95'
                                                    }`}
                                                >
                                                    {isAnalyzing ? (
                                                        <>
                                                            <RefreshIcon className="w-4 h-4 animate-spin text-white" />
                                                            <span>{analysisProgress || 'Inspecting...'}</span>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <CpuIcon className="w-4 h-4 text-cyan-200" />
                                                            <span>Execute Structural Analysis</span>
                                                        </>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    <input
                                        type="file"
                                        ref={fileInputRef}
                                        onChange={handleFileSelect}
                                        accept="image/*"
                                        multiple
                                        className="hidden"
                                    />
                                </section>

                                {/* ========================================================
                                    ON-SCREEN INSPECTION FINDINGS CARD
                                    (Styled like Resource Allocation card in reference)
                                    ======================================================== */}
                                {inspectionResult && (
                                    <section className="twin-card-glow rounded-2xl p-5 md:p-6 space-y-5">
                                        {/* Status Header */}
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-800 gap-2">
                                            <div>
                                                <div className="flex items-center gap-3">
                                                    <h2 className="text-base font-bold text-white tracking-tight">
                                                        Structural Quality Assessment
                                                    </h2>
                                                    <span className={`pill-badge ${
                                                        inspectionResult.meta.healthScore >= 85
                                                            ? 'pill-emerald'
                                                            : inspectionResult.meta.healthScore >= 70
                                                            ? 'pill-cyan'
                                                            : 'pill-rose'
                                                    }`}>
                                                        {inspectionResult.meta.severityRating}
                                                    </span>
                                                </div>
                                                <p className="text-xs text-slate-400 mt-1">
                                                    Target: <span className="text-cyan-300 capitalize">{inspectionResult.meta.element}</span> &bull; Floor {inspectionResult.meta.floor} ({inspectionResult.meta.tower}) &bull; Evaluated: {inspectionResult.meta.timestamp}
                                                </p>
                                            </div>

                                            <button
                                                onClick={() => window.print()}
                                                className="self-start sm:self-auto bg-obsidian-850 hover:bg-obsidian-800 border border-cyan-500/40 text-cyan-300 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors"
                                            >
                                                <DownloadIcon className="w-3.5 h-3.5" />
                                                <span>Download PDF Report</span>
                                            </button>
                                        </div>

                                        {/* 1. What We Observed */}
                                        <div>
                                            <h3 className="text-xs font-mono font-bold text-cyan-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                                <LayersIcon className="w-4 h-4 text-cyan-400" />
                                                1. Observed Parameters
                                            </h3>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                                                {INSPECTION_PARAMETERS.map(param => {
                                                    const m = inspectionResult.metrics[param.key];
                                                    if (!m) return null;
                                                    const isPass = m.status === 'PASS';
                                                    const isAction = m.status === 'ACTION REQUIRED';

                                                    return (
                                                        <div
                                                            key={param.key}
                                                            className="p-3 rounded-xl border border-slate-800/80 bg-obsidian-900/60"
                                                        >
                                                            <div className="flex items-center justify-between mb-1.5">
                                                                <div className="flex items-center space-x-2">
                                                                    <span className={`w-2 h-2 rounded-full ${
                                                                        isPass ? 'bg-emerald-400' : isAction ? 'bg-rose-500' : 'bg-cyan-400'
                                                                    }`}></span>
                                                                    <span className="text-xs font-bold text-white">{m.name}</span>
                                                                </div>
                                                                <span className={`pill-badge text-[10px] ${
                                                                    isPass ? 'pill-emerald' : isAction ? 'pill-rose' : 'pill-cyan'
                                                                }`}>
                                                                    {isPass ? 'Looks Good' : isAction ? 'Needs Repair' : 'Needs Attention'}
                                                                </span>
                                                            </div>
                                                            <p className="text-xs text-slate-400 leading-relaxed">
                                                                {m.detail}
                                                            </p>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* 2. Action Items */}
                                        {inspectionResult.remedialActions && inspectionResult.remedialActions.length > 0 && (
                                            <div className="bg-obsidian-900/60 rounded-xl p-4 border border-slate-800">
                                                <h3 className="text-xs font-mono font-bold text-emerald-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                                                    <CheckIcon className="w-4 h-4 text-emerald-400" />
                                                    2. Recommended Contractor Actions
                                                </h3>
                                                <ul className="space-y-1.5">
                                                    {inspectionResult.remedialActions.map((action, i) => (
                                                        <li key={i} className="flex items-start text-xs text-slate-300">
                                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 mt-1.5 mr-2 shrink-0"></span>
                                                            <span>{action}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        {/* 3. Executive Summary */}
                                        <div className="bg-obsidian-900/80 rounded-xl p-4 border border-cyan-500/25">
                                            <h3 className="text-xs font-mono font-bold text-cyan-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                                                <ShieldCheckIcon className="w-4 h-4 text-cyan-400" />
                                                3. Summary
                                            </h3>
                                            <p className="text-xs md:text-sm text-slate-200 leading-relaxed font-sans">
                                                {inspectionResult.shortSummary}
                                            </p>
                                        </div>
                                    </section>
                                )}

                                {/* Comparison Tab */}
                                {activeTab === 'comparison' && (
                                    <section className="twin-card rounded-2xl p-5 space-y-4">
                                        <div className="border-b border-slate-800 pb-3">
                                            <h2 className="text-base font-bold text-white flex items-center gap-2">
                                                <span>Drone Inspection vs. Conventional Inspection</span>
                                                <span className="pill-badge pill-emerald">AEC Benchmark</span>
                                            </h2>
                                            <p className="text-xs text-slate-400 mt-0.5">
                                                Pune high-rise superstructure empirical research findings.
                                            </p>
                                        </div>

                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs border-collapse">
                                                <thead>
                                                    <tr className="border-b border-slate-800 bg-obsidian-900/80 font-mono text-cyan-300">
                                                        <th className="p-3">Evaluation Criteria</th>
                                                        <th className="p-3 text-rose-300">Conventional Manual Inspection</th>
                                                        <th className="p-3 text-cyan-300">AeroStruct Drone Inspection</th>
                                                        <th className="p-3 text-emerald-300">Advantage</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800/60 text-slate-300">
                                                    <tr>
                                                        <td className="p-3 font-semibold text-white">Inspection Time</td>
                                                        <td className="p-3 text-slate-400">Higher (4-6 hrs per lift via cradles)</td>
                                                        <td className="p-3 text-cyan-200">Lower (15-25 min flight)</td>
                                                        <td className="p-3 text-emerald-400 font-semibold">~75% Time Reduction</td>
                                                    </tr>
                                                    <tr>
                                                        <td className="p-3 font-semibold text-white">Worker Safety at Height</td>
                                                        <td className="p-3 text-rose-300">Hazardous scaffold exposure</td>
                                                        <td className="p-3 text-emerald-300">Zero personnel working at height</td>
                                                        <td className="p-3 text-emerald-400 font-semibold">100% Fall Risk Elimination</td>
                                                    </tr>
                                                    <tr>
                                                        <td className="p-3 font-semibold text-white">Facade Accessibility</td>
                                                        <td className="p-3 text-slate-400">Limited (Cantilevers difficult)</td>
                                                        <td className="p-3 text-cyan-200">Omnidirectional standoff coverage</td>
                                                        <td className="p-3 text-emerald-400 font-semibold">360° Elevation Access</td>
                                                    </tr>
                                                    <tr>
                                                        <td className="p-3 font-semibold text-white">Digital Documentation</td>
                                                        <td className="p-3 text-slate-400">Manual field notes</td>
                                                        <td className="p-3 text-cyan-200">High-resolution photogrammetric tags</td>
                                                        <td className="p-3 text-emerald-400 font-semibold">Verifiable Traceability</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </section>
                                )}

                                {/* Methodology Tab */}
                                {activeTab === 'methodology' && (
                                    <section className="twin-card rounded-2xl p-5 space-y-4">
                                        <div className="border-b border-slate-800 pb-3">
                                            <h2 className="text-base font-bold text-white flex items-center gap-2">
                                                <span>Research Methodology & Framework</span>
                                                <span className="pill-badge pill-indigo">IS 456 Standards</span>
                                            </h2>
                                            <p className="text-xs text-slate-400 mt-0.5">
                                                Seven-phase quality assessment workflow for residential high-rise superstructure elements.
                                            </p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {[
                                                { step: '01', title: 'Literature Review', desc: 'Drone photogrammetry, building codes (IS 456), defect classification standards.' },
                                                { step: '02', title: 'Site Identification', desc: 'Selected ongoing residential high-rise project in Pune urban agglomeration.' },
                                                { step: '03', title: 'Quality Parameters', desc: 'Finalized measurable visual parameters for RCC superstructure members.' },
                                                { step: '04', title: 'Flight Planning', desc: 'Safe standoff distance, floor-by-floor routes, 30°/45°/90° gimbal viewpoints.' },
                                                { step: '05', title: 'Data Acquisition', desc: 'High-res photos/videos with timestamp, floor, and tower grid coordinate tags.' },
                                                { step: '06', title: 'Image Processing', desc: 'Automated filtering, anomaly bounding boxes, and tolerance calculations.' }
                                            ].map(item => (
                                                <div key={item.step} className="p-3.5 rounded-xl bg-obsidian-900/60 border border-slate-800">
                                                    <span className="font-mono text-xs font-bold text-cyan-400 block mb-1">PHASE {item.step}</span>
                                                    <h3 className="text-xs font-bold text-white mb-1">{item.title}</h3>
                                                    <p className="text-xs text-slate-400 leading-relaxed">{item.desc}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                )}
                            </main>
                        </div>
                    </div>

                    {/* ========================================================
                        DEDICATED PDF / PRINT REPORT VIEW
                        (Strictly NO FLUFF, NO GIMMICKS: Only Clean Letterhead,
                         Photo with Visual Annotations, and Detailed Summary)
                        ======================================================== */}
                    {inspectionResult && (
                        <div className="print-only-report">
                            {/* Formal Executive Letterhead */}
                            <div className="border-b-2 border-slate-900 pb-4 mb-6 flex justify-between items-end">
                                <div>
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className="text-xl font-bold tracking-tight text-slate-950 uppercase font-mono">AEROSTRUCT</span>
                                        <span className="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-mono font-semibold">DIGITAL TWIN QUALITY ASSESSMENT</span>
                                    </div>
                                    <p className="text-xs text-slate-600 font-medium">Structural Superstructure Quality Inspection Report &bull; Drone Photogrammetry</p>
                                </div>
                                <div className="text-right text-xs text-slate-600 space-y-0.5 font-mono">
                                    <p><span className="font-bold text-slate-900">Project:</span> Aurora Tower</p>
                                    <p><span className="font-bold text-slate-900">Element:</span> <span className="capitalize">{inspectionResult.meta.element}</span> (Floor {inspectionResult.meta.floor}, {inspectionResult.meta.tower})</p>
                                    <p><span className="font-bold text-slate-900">Date:</span> {inspectionResult.meta.timestamp}</p>
                                    <p><span className="font-bold text-slate-900">Status:</span> {inspectionResult.meta.severityRating}</p>
                                </div>
                            </div>

                            {/* Section 1: The Visual Photographic Inspection Analysis */}
                            <div className="mb-6">
                                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-800 mb-2 border-b border-slate-200 pb-1 font-mono">
                                    1. Photographic Evidence & Visual Anomaly Mapping
                                </h2>
                                <div className="relative rounded-lg overflow-hidden border border-slate-300 bg-slate-950 max-h-[380px] flex items-center justify-center">
                                    <img
                                        src={activeImg?.preview}
                                        alt="Inspection Photo"
                                        className="w-full h-auto max-h-[380px] object-contain"
                                    />
                                    {showBoundingBoxes && inspectionResult.boxes && (
                                        <div className="absolute inset-0 pointer-events-none">
                                            {inspectionResult.boxes.map(box => (
                                                <div
                                                    key={box.id}
                                                    className="absolute border-2 border-cyan-400 rounded"
                                                    style={{
                                                        left: `${box.x}%`,
                                                        top: `${box.y}%`,
                                                        width: `${box.w}%`,
                                                        height: `${box.h}%`
                                                    }}
                                                >
                                                    <span className="absolute -top-4 left-0 bg-slate-900 text-white font-mono text-[9px] font-bold px-1.5 py-0.5 rounded shadow whitespace-nowrap">
                                                        {box.label}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <p className="text-[10px] text-slate-500 mt-1.5 italic">
                                    Figure 1.1: Orthogonal / oblique aerial imagery capturing visual surface texture, vertical alignment, and formwork sleeve penetrations.
                                </p>
                            </div>

                            {/* Section 2: Detailed Engineering Assessment (NO FLUFF) */}
                            <div className="space-y-4">
                                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-200 pb-1 font-mono">
                                    2. Detailed Engineering Assessment
                                </h2>
                                
                                <div className="space-y-3 text-xs leading-relaxed text-slate-800 text-justify">
                                    <p>
                                        <strong>2.1 Structural Geometry & Plumbness: </strong>
                                        {inspectionResult.detailedReport.overview}
                                    </p>
                                    <p>
                                        <strong>2.2 Concrete Surface Integrity & Compaction: </strong>
                                        {inspectionResult.detailedReport.concreteCondition}
                                    </p>
                                    <p>
                                        <strong>2.3 Formwork Penetrations & Tie-Rod Sleeves: </strong>
                                        {inspectionResult.detailedReport.tieRodsAndPlumbing}
                                    </p>
                                    <p className="p-3 bg-slate-50 border-l-4 border-slate-900 text-slate-900 font-medium">
                                        <strong>2.4 Overall Engineering Assessment: </strong>
                                        {inspectionResult.detailedReport.conclusion}
                                    </p>
                                </div>

                                {/* Section 3: Remedial Action Checklist for Contractor */}
                                {inspectionResult.remedialActions && inspectionResult.remedialActions.length > 0 && (
                                    <div className="pt-2">
                                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 mb-2 font-mono">
                                            3. Required Contractor Remedial Actions
                                        </h3>
                                        <ul className="list-disc pl-5 text-xs text-slate-800 space-y-1">
                                            {inspectionResult.remedialActions.map((action, i) => (
                                                <li key={i}>{action}</li>
                                            ))}
                                        </ul>
                                    </div>
                                )}

                                {/* Signoff block */}
                                <div className="pt-8 mt-6 border-t border-slate-300 grid grid-cols-2 gap-8 text-xs text-slate-600">
                                    <div>
                                        <p className="font-bold text-slate-900 mb-0.5">Evaluation Protocol:</p>
                                        <p>Photogrammetric Drone Visual Inspection</p>
                                        <p className="text-[10px] text-slate-500 mt-1">Classification: <span className="font-semibold text-slate-800">{inspectionResult.meta.severityRating}</span></p>
                                    </div>
                                    <div className="text-right">
                                        <p className="font-bold text-slate-900 mb-6">Assessor Authorization:</p>
                                        <div className="border-b border-slate-400 w-48 ml-auto"></div>
                                        <p className="text-[10px] text-slate-500 mt-1">Superstructure Quality Inspector &bull; AeroStruct</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
